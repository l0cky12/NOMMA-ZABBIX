# =============================================================================
# UserParameter config for exacqVisionServer monitoring + auto-remediation
# Deploy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\userparameter_exacq.conf
# Target: Windows Server 2016+ running exacqVision
# =============================================================================

# --- Native service check (built-in key, no script needed) ---
# Item key: service.info[exacqVisionServer,state]
# Returns: 0=running, 6=stopped
# This is a native Zabbix Agent 2 key — no UserParameter required.
# Included here for documentation only.

# --- Restart result check ---
# Reads the last restart status from the flag file written by exacq_restart.ps1
# Returns: RUNNING | RESTARTED | WAITING | FAILED | NOT_FOUND
UserParameter=exacq.restart.status,powershell -ExecutionPolicy Bypass -Command "try { Get-Content 'C:\ProgramData\Zabbix\exacqvision\exacq_restart_status.txt' -ErrorAction Stop } catch { 'NO_DATA' }"

# --- Restart detail (human-readable) ---
# Reads the detailed attempt log from the last restart
UserParameter=exacq.restart.detail,powershell -ExecutionPolicy Bypass -Command "try { Get-Content 'C:\ProgramData\Zabbix\exacqvision\exacq_restart_detail.txt' -ErrorAction Stop } catch { 'NO_DATA' }"

# --- Service uptime (seconds since last boot) ---
UserParameter=exacq.uptime,(Get-CimInstance Win32_OperatingSystem).LastBootUpTime

# --- Manual trigger — call this via Zabbix Action remote command ---
# This is NOT a UserParameter — it's documented here for the Action setup.
# Remote command to run in the Zabbix Action:
#   powershell -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\exacq_restart.ps1"