zabbix_export:
  version: "7.4"
  template_groups:
    - uuid: "4b0bffd8e2f142fdb446b820a2d4d748"
      name: "NOMMA/ExacqVision"
  templates:
    - uuid: "7bb4d6c6df5b4b7ea2d99d88cebb7d8a"
      template: "NOMMA ExacqVision by Zabbix Agent"
      name: "NOMMA ExacqVision by Zabbix Agent"
      description: |
        Monitors the exacqVisionServer Windows service with auto-remediation.

        Monitors the exacqVisionServer Windows service, triggers a restart
        script after 5 minutes of downtime, and alerts if all retries fail.

        Items:
          - Native service state check (every 60s)
          - Restart status flag reader (every 60s)
          - Uptime info

        Triggers:
          - "exacqVisionServer DOWN" — fires after 5 minutes stopped
          - "exacqVisionServer restart FAILED" — all 3 retries exhausted

        Requires:
          - Zabbix Agent 2 on Windows
          - userparameter_exacq.conf deployed to zabbix_agent2.d/
          - exacq_restart.ps1 deployed to scripts/ directory
          - Zabbix Action: run remote command on DOWN trigger
          - Zabbix Action: send email on FAILED trigger
      groups:
        - name: "NOMMA/ExacqVision"
      items:
        # ---- ITEM 1: Native service state ----
        - uuid: "9f60cefe82344806a27eb8ca57d3f2c3"
          name: "exacqVisionServer: Service state"
          type: ZABBIX_ACTIVE
          key: "service.info[exacqVisionServer,state]"
          delay: "60s"
          value_type: UNSIGNED
          valuemap:
            name: "exacq_service_state"
          description: |
            Status of the exacqVisionServer Windows service.
            0 - Running
            1 - Paused
            2 - Start Pending
            3 - Stop Pending
            4 - Continuing
            5 - Pending
            6 - Stopped
            7 - Unknown
            255 - No such service
          triggers:
            - uuid: "5dac9d4b7b644b4f84cd493a3863273d"
              expression: "min(/NOMMA ExacqVision by Zabbix Agent/service.info[exacqVisionServer,state],5m)=6"
              name: "exacqVisionServer DOWN — stopped for 5+ minutes"
              priority: HIGH
              description: |
                The exacqVisionServer service has been in STOPPED state for
                at least 5 consecutive minutes.

                A Zabbix Action should trigger the restart script:
                  powershell -ExecutionPolicy Bypass -File
                    "C:\Program Files\Zabbix Agent 2\scripts\exacq_restart.ps1"

                If the restart succeeds, this trigger auto-resolves.
                If it fails, the FAILED trigger fires for email notification.
              manual_close: "NO"
              recovery_mode: NONE
              correlation_mode: DISABLED

        # ---- ITEM 2: Restart status flag ----
        - uuid: "6749cb9f1db34d858a8d24c38c822723"
          name: "exacqVisionServer: Last restart result"
          type: ZABBIX_ACTIVE
          key: "exacq.restart.status"
          delay: "60s"
          value_type: CHAR
          description: |
            Reads the status flag file written by exacq_restart.ps1.
            Values: RUNNING | RESTARTED | WAITING | FAILED | NOT_FOUND | NO_DATA

            - RUNNING: Service was already running (no restart needed)
            - RESTARTED: Script restarted the service successfully
            - WAITING: Script is restarting the service
            - FAILED: All 3 restart attempts failed
            - NOT_FOUND: Service doesn't exist on this host
            - NO_DATA: Status file not yet created
          triggers:
            - uuid: "acd33f655b84410785d5a160eb8f806f"
              expression: "last(/NOMMA ExacqVision by Zabbix Agent/exacq.restart.status)=\"FAILED\""
              name: "exacqVisionServer restart FAILED — manual intervention required"
              priority: DISASTER
              description: |
                The exacq_restart.ps1 script attempted to restart the
                exacqVisionServer service 3 times and all attempts failed.

                Action required:
                  1. RDP to the camera server (10.1.0.208)
                  2. Check C:\ProgramData\Zabbix\exacqvision\exacq_restart.log
                  3. Verify exacqVisionServer service status manually
                  4. Check Windows Event Viewer for service errors
                  5. Restart the service or server manually if needed
              manual_close: "YES"
              recovery_mode: NONE
              correlation_mode: DISABLED

        # ---- ITEM 3: System uptime ----
        - uuid: "a1d9471afd014b53a7b8f51c0783aa82"
          name: "Camera server: System uptime"
          type: ZABBIX_ACTIVE
          key: "exacq.uptime"
          delay: "300s"
          value_type: FLOAT
          units: "uptime"
          description: "Seconds since the camera server last booted (useful for correlating restarts)"

      discovery_rules: []
      dashboards: []
      tags:
        - tag: "service"
          value: "exacqvision"
        - tag: "class"
          value: "surveillance"
      macros: []
      valuemaps:
        - uuid: "b1e8963e15774ee88f40a6a20239e599"
          name: "exacq_service_state"
          mappings:
            - value: "0"
              newvalue: "Running"
            - value: "1"
              newvalue: "Paused"
            - value: "2"
              newvalue: "Start Pending"
            - value: "3"
              newvalue: "Stop Pending"
            - value: "4"
              newvalue: "Continuing"
            - value: "5"
              newvalue: "Pending"
            - value: "6"
              newvalue: "Stopped"
            - value: "7"
              newvalue: "Unknown"
            - value: "255"
              newvalue: "No Such Service"