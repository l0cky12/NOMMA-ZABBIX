#===============================================================================
# UserParameter config for SSL/TLS certificate monitoring - Linux
# Deploy to: /etc/zabbix/zabbix_agent2.d/linux-ssl.conf
# Script to: /usr/local/bin/linux-cert-discovery.sh  (chmod 0755, root:root)
# Template:  NOMMA SSL Certificates by Zabbix Agent 2
#===============================================================================
#
# The endpoint check (web.certificate.get) is a built-in Zabbix Agent 2 key and
# needs no UserParameter. It is listed here for documentation only:
#
#   web.certificate.get[<hostname>,<port>]
#
# The template drives it from the host macro {$TLS.ENDPOINTS}, so nothing has
# to be configured on the agent for endpoint monitoring beyond having Agent 2
# installed and running active checks.
#
# Everything below covers the secondary on-disk certificate scan. The script is
# read-only: it does not write files, restart services or change configuration.
#
# sudo is used because certificates in /etc/ssl/private, /etc/pki and
# /home/papercut/server/custom are normally not readable by the zabbix user.
# Add exactly this line with visudo (see docs/deployment-guide.md):
#
#   zabbix ALL=(root) NOPASSWD: /usr/local/bin/linux-cert-discovery.sh
#
# After deploying this file:  sudo systemctl restart zabbix-agent2
#===============================================================================

# --- On-disk certificate discovery (LLD) ---
# $1 = comma separated scan paths, supplied by the discovery rule as
#      {$TLS.STORE.PATHS}. Returns LLD JSON with {#TLS.CERT.FILE},
#      {#TLS.CERT.CN}, {#TLS.CERT.SUBJECT}, {#TLS.CERT.ISSUER},
#      {#TLS.CERT.NOTAFTER} and {#TLS.CERT.TYPE}.
UserParameter=tls.certs.linux.discovery[*],sudo -n /usr/local/bin/linux-cert-discovery.sh discover "$1"

# --- Days until a specific certificate file expires ---
# $1 = certificate path, supplied by the item prototype as {#TLS.CERT.FILE}
# $2 = comma separated scan paths ({$TLS.STORE.PATHS}), used by the script to
#      reject any path outside the configured roots.
# Returns a whole number, negative once expired.
UserParameter=tls.certs.linux.expiry[*],sudo -n /usr/local/bin/linux-cert-discovery.sh expiry "$1" "$2"

#===============================================================================
# Notes
#===============================================================================
# - Certificate paths contain '/' and ',' only, which Zabbix allows in key
#   parameters, so UnsafeUserParameters is NOT required.
# - PKCS#12 keystores (.p12/.pfx) are only opened when
#   /etc/zabbix/tls_check.env exists and contains TLS_P12_PASSWORD.
#   That file must be root-owned and chmod 0600. It is parsed, never sourced.
#   When it is missing, .p12 files are skipped silently.
# - /etc/ssl/certs (system trust roots) is always excluded by the script.
# - Verify with (exactly what the agent runs, as the zabbix user):
#     sudo -u zabbix sudo -n /usr/local/bin/linux-cert-discovery.sh discover
#     zabbix_agent2 -t tls.certs.linux.discovery["/etc/pki,/etc/nginx"]
