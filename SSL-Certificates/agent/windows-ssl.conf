# =============================================================================
# UserParameter config for SSL/TLS certificate monitoring - Windows
# Deploy to: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\windows-ssl.conf
# Script to: C:\Program Files\Zabbix Agent 2\scripts\win-cert-discovery.ps1
# Template:  NOMMA SSL Certificates by Zabbix Agent 2
# =============================================================================
#
# The endpoint check (web.certificate.get) is a built-in Zabbix Agent 2 key and
# needs no UserParameter. It is listed here for documentation only:
#
#   web.certificate.get[<hostname>,<port>]
#
# The template drives it from the host macro {$TLS.ENDPOINTS}, so nothing has
# to be configured on the agent for endpoint monitoring beyond having Agent 2
# installed and running active checks.
#
# Everything below covers the secondary store scan of Cert:\LocalMachine\My.
# The script is read-only: it does not write files, touch the registry or
# restart services.
#
# After deploying this file:  Restart-Service "Zabbix Agent 2"
# =============================================================================

# --- Machine certificate store discovery (LLD) ---
# Returns LLD JSON with {#TLS.CERT.THUMBPRINT}, {#TLS.CERT.CN},
# {#TLS.CERT.SUBJECT}, {#TLS.CERT.ISSUER}, {#TLS.CERT.NOTAFTER},
# {#TLS.CERT.STORE} and {#TLS.CERT.DAYS}.
UserParameter=tls.certs.win.discovery,powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\win-cert-discovery.ps1" -Mode discover

# --- Days until a specific machine certificate expires ---
# $1 = certificate thumbprint, supplied by the item prototype as
#      {#TLS.CERT.THUMBPRINT}. Returns a whole number, negative once expired.
UserParameter=tls.certs.win.expiry[*],powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\win-cert-discovery.ps1" -Mode expiry -Thumbprint "$1"

# =============================================================================
# Notes
# =============================================================================
# - Thumbprints are hexadecimal only, so UnsafeUserParameters is NOT required.
# - The Zabbix Agent 2 service runs as LocalSystem by default, which can read
#   Cert:\LocalMachine\My. No extra rights are needed.
# - If TLS handshakes to slow endpoints time out, raise Timeout in
#   zabbix_agent2.conf (default 3, maximum 30) rather than editing the template.
# - Verify with:
#     zabbix_agent2 -t tls.certs.win.discovery
#     zabbix_agent2 -t tls.certs.win.expiry[<thumbprint>]
