#===============================================================================
# PaperCut NG — Zabbix Agent 2 UserParameter Configuration
# Place this file at: /etc/zabbix/zabbix_agent2.d/papercut.conf
#===============================================================================
# All custom scripts are located in /usr/local/bin/ and must be executable.
# Test each one with: sudo -u zabbix /usr/local/bin/papercut_health.sh <check>
#===============================================================================

# ─── PaperCut Application Server Status ───────────────────────────────────────
UserParameter=papercut.appserver.status,sudo /usr/local/bin/papercut_health.sh appserver

# ─── Database Connection ──────────────────────────────────────────────────────
UserParameter=papercut.db.connection,sudo /usr/local/bin/papercut_health.sh db_connection

# ─── Database Connection Pool Utilisation (%) ────────────────────────────────
UserParameter=papercut.db.pool,sudo /usr/local/bin/papercut_health.sh db_pool

# ─── License Validity ─────────────────────────────────────────────────────────
UserParameter=papercut.license.valid,sudo /usr/local/bin/papercut_health.sh license

# ─── License Expiry (days remaining) ──────────────────────────────────────────
UserParameter=papercut.license.expiry,sudo /usr/local/bin/papercut_health.sh license_expiry

# ─── Offline Site Servers ─────────────────────────────────────────────────────
UserParameter=papercut.siteservers.offline,sudo /usr/local/bin/papercut_health.sh siteservers_off

# ─── Disk Usage ───────────────────────────────────────────────────────────────
UserParameter=papercut.disk.root.pused,sudo /usr/local/bin/papercut_health.sh disk_root
UserParameter=papercut.disk.home.pused,sudo /usr/local/bin/papercut_health.sh disk_home

# ─── Printer Counts ───────────────────────────────────────────────────────────
UserParameter=papercut.printers.total,sudo /usr/local/bin/papercut_printers.sh total
UserParameter=papercut.printers.online,sudo /usr/local/bin/papercut_printers.sh online
UserParameter=papercut.printers.offline,sudo /usr/local/bin/papercut_printers.sh offline
UserParameter=papercut.printers.toner_low,sudo /usr/local/bin/papercut_printers.sh toner_low
UserParameter=papercut.printers.errors,sudo /usr/local/bin/papercut_printers.sh errors

# ─── Print Activity ───────────────────────────────────────────────────────────
UserParameter=papercut.activity.minutes_since,sudo /usr/local/bin/papercut_activity.sh minutes_since
UserParameter=papercut.activity.jobs_last_hour,sudo /usr/local/bin/papercut_activity.sh jobs_last_hour
UserParameter=papercut.activity.jobs_last_day,sudo /usr/local/bin/papercut_activity.sh jobs_last_day